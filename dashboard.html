<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | Nooit Meer Vergeten</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --dark: #111827;
    --dark-light: #1f2937;
    --background: #f5f7fa;
    --white: #ffffff;
    --border: #e5e7eb;
    --text: #17202a;
    --muted: #6b7280;
    --light: #f9fafb;
    --danger: #b91c1c;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* APP */

.app {
    min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 250px;
    background: var(--dark);
    color: white;
    padding: 28px 18px;
    display: flex;
    flex-direction: column;
    z-index: 50;
}

.logo {
    padding: 0 14px 34px;
}

.logo h1 {
    font-size: 20px;
    letter-spacing: -.5px;
}

.logo p {
    margin-top: 6px;
    color: #9ca3af;
    font-size: 12px;
}

.menu-title {
    padding: 0 14px;
    margin-bottom: 10px;
    color: #6b7280;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.menu button {
    border: 0;
    background: transparent;
    color: #cbd5e1;
    text-align: left;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
}

.menu button:hover,
.menu button.active {
    background: var(--dark-light);
    color: white;
}

.sidebar-bottom {
    margin-top: auto;
}

.logout {
    width: 100%;
    border: 1px solid #374151;
    background: transparent;
    color: #d1d5db;
    padding: 11px;
    border-radius: 8px;
}

.logout:hover {
    background: var(--dark-light);
}

/* MAIN */

.main {
    margin-left: 250px;
    min-height: 100vh;
}

.topbar {
    height: 72px;
    background: white;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px;
}

.search {
    width: 380px;
}

.search input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--light);
    border-radius: 8px;
    padding: 11px 14px;
    outline: none;
}

.search input:focus {
    border-color: #9ca3af;
    background: white;
}

.user {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--dark);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
}

.user-name {
    font-size: 14px;
    font-weight: 600;
}

/* CONTENT */

.content {
    max-width: 1450px;
    padding: 36px;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
}

.page-header h2 {
    font-size: 28px;
    letter-spacing: -.8px;
}

.page-header p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 7px;
}

.primary {
    border: 0;
    background: var(--dark);
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    font-weight: 600;
}

.primary:hover {
    background: #1f2937;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
}

.stat {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
}

.stat-label {
    color: var(--muted);
    font-size: 13px;
}

.stat-number {
    font-size: 30px;
    font-weight: 700;
    margin-top: 8px;
}

/* PANEL */

.panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
}

.panel-header {
    padding: 20px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.panel-header h3 {
    font-size: 16px;
}

.filters {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.filter {
    border: 1px solid var(--border);
    background: white;
    color: #4b5563;
    padding: 8px 12px;
    border-radius: 7px;
    font-size: 12px;
}

.filter.active {
    background: var(--dark);
    color: white;
    border-color: var(--dark);
}

/* REMINDERS */

.reminder {
    padding: 19px 22px;
    border-bottom: 1px solid #f0f1f3;
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.reminder:last-child {
    border-bottom: 0;
}

.reminder-left {
    display: flex;
    gap: 14px;
    min-width: 0;
}

.check {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    border: 1px solid #cbd5e1;
    border-radius: 5px;
    background: white;
    margin-top: 2px;
}

.check.done {
    background: var(--dark);
    border-color: var(--dark);
}

.reminder-title {
    font-size: 14px;
    font-weight: 600;
}

.reminder.done .reminder-title {
    text-decoration: line-through;
    color: #9ca3af;
}

.reminder-description {
    margin-top: 5px;
    color: var(--muted);
    font-size: 13px;
}

.meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 9px;
}

.badge {
    background: #f3f4f6;
    color: #4b5563;
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 11px;
}

.badge.high {
    background: #fee2e2;
    color: #991b1b;
}

.badge.medium {
    background: #fef3c7;
    color: #92400e;
}

.badge.low {
    background: #ecfdf5;
    color: #166534;
}

.actions {
    display: flex;
    gap: 6px;
    align-items: flex-start;
}

.action {
    border: 1px solid var(--border);
    background: white;
    color: #4b5563;
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 12px;
}

.action:hover {
    background: var(--light);
}

.action.delete:hover {
    color: var(--danger);
}

.empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
}

/* MODAL */

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, .55);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 570px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 25px 60px rgba(0,0,0,.2);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.modal-header h3 {
    font-size: 20px;
}

.close {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 24px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    padding: 11px 12px;
    outline: none;
    background: white;
}

.form-group textarea {
    min-height: 85px;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: #6b7280;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 22px;
}

.secondary {
    border: 1px solid #d1d5db;
    background: white;
    color: #374151;
    padding: 11px 16px;
    border-radius: 7px;
}

/* MOBILE */

@media (max-width: 1000px) {

    .sidebar {
        width: 215px;
    }

    .main {
        margin-left: 215px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .search {
        width: 300px;
    }
}

@media (max-width: 720px) {

    .sidebar {
        position: static;
        width: 100%;
        height: auto;
        padding: 18px;
    }

    .app {
        display: block;
    }

    .logo {
        padding-bottom: 18px;
    }

    .menu-title {
        display: none;
    }

    .menu {
        flex-direction: row;
        overflow-x: auto;
    }

    .menu button {
        white-space: nowrap;
    }

    .sidebar-bottom {
        margin-top: 12px;
    }

    .main {
        margin-left: 0;
    }

    .topbar {
        padding: 15px 20px;
        height: auto;
        gap: 15px;
    }

    .search {
        width: 100%;
    }

    .user-name {
        display: none;
    }

    .content {
        padding: 20px;
    }

    .page-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 16px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .panel-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .reminder {
        flex-direction: column;
    }

    .actions {
        margin-left: 34px;
    }

    .form-row {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <h1>Nooit Meer Vergeten</h1>
            <p>Persoonlijk overzicht</p>
        </div>

        <div class="menu-title">Navigatie</div>

        <nav class="menu">

            <button class="active" onclick="changeView('all', this)">
                Overzicht
            </button>

            <button onclick="changeView('today', this)">
                Vandaag
            </button>

            <button onclick="changeView('upcoming', this)">
                Aankomend
            </button>

            <button onclick="changeView('completed', this)">
                Voltooid
            </button>

            <button onclick="openModal()">
                Nieuwe herinnering
            </button>

        </nav>

        <div class="sidebar-bottom">
            <button class="logout" onclick="logout()">
                Uitloggen
            </button>
        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <div class="search">
                <input
                    id="search"
                    type="text"
                    placeholder="Zoek herinneringen..."
                    oninput="render()"
                >
            </div>

            <div class="user">

                <div class="avatar" id="avatar">
                    ?
                </div>

                <div class="user-name" id="userName">
                    Gebruiker
                </div>

            </div>

        </header>


        <section class="content">

            <div class="page-header">

                <div>

                    <h2 id="pageTitle">
                        Overzicht
                    </h2>

                    <p id="pageDescription">
                        Beheer hier al je herinneringen.
                    </p>

                </div>

                <button
                    class="primary"
                    onclick="openModal()">

                    Nieuwe herinnering

                </button>

            </div>


            <div class="stats">

                <div class="stat">
                    <div class="stat-label">
                        Totaal
                    </div>

                    <div
                        class="stat-number"
                        id="total">
                        0
                    </div>
                </div>


                <div class="stat">
                    <div class="stat-label">
                        Vandaag
                    </div>

                    <div
                        class="stat-number"
                        id="today">
                        0
                    </div>
                </div>


                <div class="stat">
                    <div class="stat-label">
                        Aankomend
                    </div>

                    <div
                        class="stat-number"
                        id="upcoming">
                        0
                    </div>
                </div>


                <div class="stat">
                    <div class="stat-label">
                        Voltooid
                    </div>

                    <div
                        class="stat-number"
                        id="completed">
                        0
                    </div>
                </div>

            </div>


            <div class="panel">

                <div class="panel-header">

                    <h3>
                        Herinneringen
                    </h3>

                    <div class="filters">

                        <button
                            class="filter active"
                            onclick="setFilter('all', this)">
                            Alles
                        </button>

                        <button
                            class="filter"
                            onclick="setFilter('open', this)">
                            Openstaand
                        </button>

                        <button
                            class="filter"
                            onclick="setFilter('done', this)">
                            Voltooid
                        </button>

                    </div>

                </div>

                <div id="list"></div>

            </div>

        </section>

    </main>

</div>


<!-- MODAL -->

<div
    class="overlay"
    id="overlay">

    <div class="modal">

        <div class="modal-header">

            <h3 id="modalTitle">
                Nieuwe herinnering
            </h3>

            <button
                class="close"
                onclick="closeModal()">
                ×
            </button>

        </div>


        <form id="form">

            <div class="form-group">

                <label for="title">
                    Titel
                </label>

                <input
                    id="title"
                    type="text"
                    placeholder="Bijvoorbeeld: Tandartsafspraak"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Beschrijving
                </label>

                <textarea
                    id="description"
                    placeholder="Extra informatie..."
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="date">
                        Datum
                    </label>

                    <input
                        id="date"
                        type="date"
                    >

                </div>


                <div class="form-group">

                    <label for="time">
                        Tijd
                    </label>

                    <input
                        id="time"
                        type="time"
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="category">
                        Categorie
                    </label>

                    <select id="category">

                        <option value="">
                            Geen categorie
                        </option>

                        <option value="Persoonlijk">
                            Persoonlijk
                        </option>

                        <option value="Werk">
                            Werk
                        </option>

                        <option value="Privé">
                            Privé
                        </option>

                        <option value="Financiën">
                            Financiën
                        </option>

                        <option value="Gezondheid">
                            Gezondheid
                        </option>

                        <option value="Afspraken">
                            Afspraken
                        </option>

                        <option value="Overig">
                            Overig
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="priority">
                        Prioriteit
                    </label>

                    <select id="priority">

                        <option value="laag">
                            Laag
                        </option>

                        <option
                            value="normaal"
                            selected>
                            Normaal
                        </option>

                        <option value="hoog">
                            Hoog
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="repeat">
                    Herhaling
                </label>

                <select id="repeat">

                    <option value="geen">
                        Geen herhaling
                    </option>

                    <option value="dagelijks">
                        Dagelijks
                    </option>

                    <option value="wekelijks">
                        Wekelijks
                    </option>

                    <option value="maandelijks">
                        Maandelijks
                    </option>

                    <option value="jaarlijks">
                        Jaarlijks
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="notes">
                    Notities
                </label>

                <textarea
                    id="notes"
                    placeholder="Extra informatie, locatie of instructies..."
                ></textarea>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="secondary"
                    onclick="closeModal()">
                    Annuleren
                </button>

                <button
                    type="submit"
                    class="primary">
                    Opslaan
                </button>

            </div>

        </form>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://fqupzovqwzaqkatcfbka.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ahp4b1jbybZmcQDDkkdNrg_IvbVXZsY";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   VARIABELEN
========================= */

let currentUser = null;
let reminders = [];
let filter = "all";
let view = "all";
let editingId = null;


/* =========================
   START
========================= */

async function init() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();

    if (!session) {
        window.location.href = "/inloggen.html";
        return;
    }

    currentUser = session.user;

    const name =
        currentUser.user_metadata?.naam ||
        currentUser.email?.split("@")[0] ||
        "Gebruiker";

    document.getElementById("userName").textContent =
        name;

    document.getElementById("avatar").textContent =
        name.charAt(0).toUpperCase();

    await loadReminders();
}


/* =========================
   DATA LADEN
========================= */

async function loadReminders() {

    const {
        data,
        error
    } = await supabaseClient
        .from("reminders")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("datum", {
            ascending: true
        })
        .order("tijd", {
            ascending: true
        });

    if (error) {

        console.error(error);

        alert(
            "De herinneringen konden niet worden geladen."
        );

        return;
    }

    reminders = data || [];

    updateStats();
    render();
}


/* =========================
   STATISTIEKEN
========================= */

function updateStats() {

    const today =
        new Date()
            .toISOString()
            .split("T")[0];

    const total =
        reminders.length;

    const completed =
        reminders.filter(
            reminder => reminder.afgerond
        ).length;

    const todayCount =
        reminders.filter(
            reminder =>
                reminder.datum === today &&
                !reminder.afgerond
        ).length;

    const upcomingCount =
        reminders.filter(
            reminder =>
                reminder.datum &&
                reminder.datum > today &&
                !reminder.afgerond
        ).length;

    document.getElementById("total").textContent =
        total;

    document.getElementById("today").textContent =
        todayCount;

    document.getElementById("upcoming").textContent =
        upcomingCount;

    document.getElementById("completed").textContent =
        completed;
}


/* =========================
   RENDER
========================= */

function render() {

    const list =
        document.getElementById("list");

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const today =
        new Date()
            .toISOString()
            .split("T")[0];

    let result =
        reminders.filter(reminder => {

            const title =
                (reminder.titel || "")
                    .toLowerCase();

            const description =
                (reminder.beschrijving || "")
                    .toLowerCase();

            const category =
                (reminder.categorie || "")
                    .toLowerCase();

            const matchesSearch =
                title.includes(search) ||
                description.includes(search) ||
                category.includes(search);

            if (!matchesSearch) {
                return false;
            }

            if (filter === "open" &&
                reminder.afgerond) {
                return false;
            }

            if (filter === "done" &&
                !reminder.afgerond) {
                return false;
            }

            if (view === "today") {

                return (
                    reminder.datum === today &&
                    !reminder.afgerond
                );
            }

            if (view === "upcoming") {

                return (
                    reminder.datum &&
                    reminder.datum > today &&
                    !reminder.afgerond
                );
            }

            if (view === "completed") {
                return reminder.afgerond;
            }

            return true;
        });


    if (!result.length) {

        list.innerHTML = `
            <div class="empty">
                Geen herinneringen gevonden.
            </div>
        `;

        return;
    }


    list.innerHTML =
        result
            .map(reminder => createReminderHtml(reminder))
            .join("");
}


/* =========================
   HERINNERING HTML
========================= */

function createReminderHtml(reminder) {

    const date =
        reminder.datum
            ? formatDate(reminder.datum)
            : "Geen datum";

    const time =
        reminder.tijd
            ? reminder.tijd.substring(0, 5)
            : "";

    let priorityClass = "";

    if (reminder.prioriteit === "hoog") {
        priorityClass = "high";
    }

    if (reminder.prioriteit === "normaal") {
        priorityClass = "medium";
    }

    if (reminder.prioriteit === "laag") {
        priorityClass = "low";
    }


    return `
        <div class="reminder ${reminder.afgerond ? "done" : ""}">

            <div class="reminder-left">

                <button
                    class="check ${reminder.afgerond ? "done" : ""}"
                    onclick="toggleComplete(
                        ${reminder.id},
                        ${!reminder.afgerond}
                    )">
                </button>


                <div>

                    <div class="reminder-title">
                        ${escapeHtml(reminder.titel)}
                    </div>


                    ${
                        reminder.beschrijving
                        ? `
                            <div class="reminder-description">
                                ${escapeHtml(
                                    reminder.beschrijving
                                )}
                            </div>
                        `
                        : ""
                    }


                    <div class="meta">

                        <span class="badge">
                            ${date}
                        </span>

                        ${
                            time
                            ? `
                                <span class="badge">
                                    ${time}
                                </span>
                            `
                            : ""
                        }


                        ${
                            reminder.categorie
                            ? `
                                <span class="badge">
                                    ${escapeHtml(
                                        reminder.categorie
                                    )}
                                </span>
                            `
                            : ""
                        }


                        ${
                            reminder.prioriteit
                            ? `
                                <span class="badge ${priorityClass}">
                                    Prioriteit:
                                    ${escapeHtml(
                                        reminder.prioriteit
                                    )}
                                </span>
                            `
                            : ""
                        }


                        ${
                            reminder.herhaling &&
                            reminder.herhaling !== "geen"
                            ? `
                                <span class="badge">
                                    ${escapeHtml(
                                        reminder.herhaling
                                    )}
                                </span>
                            `
                            : ""
                        }

                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    class="action"
                    onclick="editReminder(${reminder.id})">
                    Bewerken
                </button>

                <button
                    class="action delete"
                    onclick="deleteReminder(${reminder.id})">
                    Verwijderen
                </button>

            </div>

        </div>
    `;
}


/* =========================
   FILTER
========================= */

function setFilter(value, button) {

    filter = value;

    document
        .querySelectorAll(".filter")
        .forEach(element =>
            element.classList.remove("active")
        );

    button.classList.add("active");

    render();
}


/* =========================
   MENU
========================= */

function changeView(value, button) {

    view = value;

    document
        .querySelectorAll(".menu button")
        .forEach(element =>
            element.classList.remove("active")
        );

    button.classList.add("active");


    const titles = {

        all: [
            "Overzicht",
            "Beheer hier al je herinneringen."
        ],

        today: [
            "Vandaag",
            "Bekijk wat er vandaag gepland staat."
        ],

        upcoming: [
            "Aankomend",
            "Bekijk je komende herinneringen."
        ],

        completed: [
            "Voltooid",
            "Bekijk je afgeronde herinneringen."
        ]
    };


    document.getElementById("pageTitle").textContent =
        titles[value][0];

    document.getElementById("pageDescription").textContent =
        titles[value][1];


    render();
}


/* =========================
   MODAL
========================= */

function openModal() {

    editingId = null;

    document.getElementById("modalTitle").textContent =
        "Nieuwe herinnering";

    document.getElementById("form").reset();

    document.getElementById("priority").value =
        "normaal";

    document.getElementById("repeat").value =
        "geen";

    document
        .getElementById("overlay")
        .classList.add("show");
}


function closeModal() {

    document
        .getElementById("overlay")
        .classList.remove("show");

    editingId = null;
}


/* =========================
   OPSLAAN
========================= */

document
    .getElementById("form")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const reminder = {

                titel:
                    document
                        .getElementById("title")
                        .value
                        .trim(),

                beschrijving:
                    document
                        .getElementById("description")
                        .value
                        .trim() || null,

                datum:
                    document
                        .getElementById("date")
                        .value || null,

                tijd:
                    document
                        .getElementById("time")
                        .value || null,

                categorie:
                    document
                        .getElementById("category")
                        .value || null,

                prioriteit:
                    document
                        .getElementById("priority")
                        .value || "normaal",

                herhaling:
                    document
                        .getElementById("repeat")
                        .value || "geen",

                notities:
                    document
                        .getElementById("notes")
                        .value
                        .trim() || null
            };


            if (!reminder.titel) {
                return;
            }


            let error;


            if (editingId) {

                const result =
                    await supabaseClient
                        .from("reminders")
                        .update(reminder)
                        .eq("id", editingId)
                        .eq(
                            "user_id",
                            currentUser.id
                        );

                error = result.error;

            } else {

                const result =
                    await supabaseClient
                        .from("reminders")
                        .insert({
                            ...reminder,
                            user_id:
                                currentUser.id,
                            afgerond:
                                false
                        });

                error = result.error;
            }


            if (error) {

                console.error(error);

                alert(
                    "De herinnering kon niet worden opgeslagen."
                );

                return;
            }


            closeModal();

            await loadReminders();
        }
    );


/* =========================
   BEWERKEN
========================= */

function editReminder(id) {

    const reminder =
        reminders.find(
            item => item.id === id
        );

    if (!reminder) {
        return;
    }


    editingId = id;


    document.getElementById("modalTitle").textContent =
        "Herinnering bewerken";


    document.getElementById("title").value =
        reminder.titel || "";


    document.getElementById("description").value =
        reminder.beschrijving || "";


    document.getElementById("date").value =
        reminder.datum || "";


    document.getElementById("time").value =
        reminder.tijd
            ? reminder.tijd.substring(0, 5)
            : "";


    document.getElementById("category").value =
        reminder.categorie || "";


    document.getElementById("priority").value =
        reminder.prioriteit || "normaal";


    document.getElementById("repeat").value =
        reminder.herhaling || "geen";


    document.getElementById("notes").value =
        reminder.notities || "";


    document
        .getElementById("overlay")
        .classList.add("show");
}


/* =========================
   VOLTOOIEN
========================= */

async function toggleComplete(
    id,
    completed
) {

    const {
        error
    } = await supabaseClient
        .from("reminders")
        .update({
            afgerond: completed
        })
        .eq("id", id)
        .eq(
            "user_id",
            currentUser.id
        );


    if (error) {

        console.error(error);

        return;
    }


    await loadReminders();
}


/* =========================
   VERWIJDEREN
========================= */

async function deleteReminder(id) {

    const reminder =
        reminders.find(
            item => item.id === id
        );

    if (!reminder) {
        return;
    }


    if (
        !confirm(
            `Weet je zeker dat je "${reminder.titel}" wilt verwijderen?`
        )
    ) {
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("reminders")
        .delete()
        .eq("id", id)
        .eq(
            "user_id",
            currentUser.id
        );


    if (error) {

        console.error(error);

        alert(
            "De herinnering kon niet worden verwijderd."
        );

        return;
    }


    await loadReminders();
}


/* =========================
   DATUM
========================= */

function formatDate(date) {

    const parts =
        date.split("-");

    if (parts.length !== 3) {
        return date;
    }

    return (
        parts[2] +
        "-" +
        parts[1] +
        "-" +
        parts[0]
    );
}


/* =========================
   HTML VEILIG MAKEN
========================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================
   UITLOGGEN
========================= */

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "/inloggen.html";
}


/* =========================
   START
========================= */

init();

</script>
