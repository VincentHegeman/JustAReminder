<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inloggen – Nooit Meer Vergeten</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .container {
      max-width: 430px;
      margin: 70px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      line-height: 1.5;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .register {
      text-align: center;
      margin-top: 22px;
    }

    .register a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Welkom terug 👋</h1>

    <p class="subtitle">
      Log in bij Nooit Meer Vergeten
    </p>

    <label for="email">E-mailadres</label>

    <input
      type="email"
      id="email"
      placeholder="jouw@email.nl"
      autocomplete="email"
    >

    <label for="password">Wachtwoord</label>

    <input
      type="password"
      id="password"
      placeholder="Je wachtwoord"
      autocomplete="current-password"
    >

    <button id="loginButton" onclick="login()">
      Inloggen
    </button>

    <div id="message" class="message"></div>

    <div class="register">
      Nog geen account?
      <a href="/account.html">Account aanmaken</a>
    </div>

  </div>
</div>

<script>

const SUPABASE_URL =
  "https://fqupzovqwzaqkatcfbka.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ahp4b1jbybZmcQDDkkdNrg_IvbVXZsY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function showMessage(text, type) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    "message " + type;

  message.style.display = "block";
}


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const button =
    document.getElementById("loginButton");


  if (!email || !password) {

    showMessage(
      "Vul je e-mailadres en wachtwoord in.",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent = "Inloggen...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    console.error(error);

    if (
      error.message
        .toLowerCase()
        .includes("email not confirmed")
    ) {

      showMessage(
        "Je e-mailadres is nog niet bevestigd. Controleer je e-mail en klik op de bevestigingslink.",
        "error"
      );

    } else {

      showMessage(
        "Inloggen mislukt: " + error.message,
        "error"
      );
    }

    button.disabled = false;

    button.textContent = "Inloggen";

    return;
  }


  if (data.user) {

    showMessage(
      "Inloggen gelukt! Je wordt doorgestuurd...",
      "success"
    );

    setTimeout(function() {

      window.location.href =
        "/dashboard.html";

    }, 800);

  }

}

</script>

</body>
</html>
