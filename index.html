<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nooit Meer Vergeten</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .box {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 45px 30px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 42px;
      margin: 0 0 15px;
    }

    p {
      font-size: 18px;
      color: #6b7280;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #1f2937;
    }
  </style>
</head>

<body>

  <div class="hero">

    <div class="box">

      <h1>🧠 Nooit Meer Vergeten</h1>

      <p>
        Bewaar je herinneringen op één veilige plek
        en vergeet nooit meer wat belangrijk is.
      </p>

      <div class="buttons">

        <a
          href="/inloggen.html"
          class="primary"
        >
          Inloggen
        </a>

        <a
          href="/account.html"
          class="secondary"
        >
          Account aanmaken
        </a>

      </div>

    </div>

  </div>

</body>
</html>
